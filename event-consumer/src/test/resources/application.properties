# Replaces src/main/resources/application.properties for the test run (same-name classpath shadowing).
spring.application.name=event-consumer
spring.cloud.config.enabled=false
eureka.client.enabled=false

bank.kafka.topic=bank.transactions.created
bank.kafka.group-id=bank-event-consumer-test

spring.kafka.consumer.group-id=${bank.kafka.group-id}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

management.endpoints.web.exposure.include=health,info
