spring.application.name=event-consumer
server.port=8083

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

bank.kafka.topic=bank.transactions.created
bank.kafka.group-id=bank-event-consumer

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${bank.kafka.group-id}
spring.kafka.consumer.auto-offset-reset=earliest
# Raw JSON in, parsed by the listener: no type header or shared class needed with the producer.
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
