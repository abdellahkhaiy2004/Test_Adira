spring.application.name=transaction-service
server.port=8082

# Centralized configuration (Part 3).
# bank.transaction.max-amount is deliberately NOT defined here: it is served by the Config Server
# (config-server/src/main/resources/config/transaction-service.properties), as the exam requires.
# Without the Config Server the service fails at startup with a message naming the missing property.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Service registration / discovery (Part 3).
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Empty on purpose: with no explicit url, Feign resolves the "account-service" instance through Eureka and
# load-balances across them. Setting ACCOUNT_SERVICE_URL pins it to one host instead (used by the tests).
bank.account-service.url=${ACCOUNT_SERVICE_URL:}

# Resilience4J (circuit breaker + time limiter) around every Feign call.
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2500
bank.resilience.timeout-ms=3000
bank.resilience.minimum-calls=5
bank.resilience.failure-rate-threshold=50
bank.resilience.open-state-seconds=10

# Datasource: in-memory H2 (development / tests only; data is lost on restart).
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Kafka (Part 4). Events are published only after a transaction is committed.
# Set bank.kafka.enabled=false to run the service with no broker available.
bank.kafka.enabled=${KAFKA_ENABLED:true}
bank.kafka.topic=bank.transactions.created
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# GraphQL connector: same service layer as REST.
spring.graphql.graphiql.enabled=true

# MCP connector: same service layer as REST and GraphQL.
spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
