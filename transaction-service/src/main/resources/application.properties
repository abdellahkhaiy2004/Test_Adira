spring.application.name=transaction-service
server.port=8082

# Config Server and Eureka do not exist yet (Part 3): disabled for now.
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Shared business parameter. Part 3 moves it to the Config Server (exam part D.3).
bank.transaction.max-amount=1000

# Direct URL to account-service until Eureka discovery is available (Part 3).
bank.account-service.url=http://localhost:8081

# Resilience4J (circuit breaker + time limiter) around every Feign call.
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2500
bank.resilience.timeout-ms=3000
bank.resilience.minimum-calls=5
bank.resilience.failure-rate-threshold=50
bank.resilience.open-state-seconds=10

# Datasource: in-memory H2 (development / tests only; data is lost on restart).
spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
