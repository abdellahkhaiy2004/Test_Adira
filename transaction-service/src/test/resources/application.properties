# Test configuration. A file with this name on the test classpath REPLACES the one in src/main/resources,
# so everything the tests need is repeated here, with the infrastructure clients switched off to keep
# the suite offline and fast.
spring.application.name=transaction-service

spring.cloud.config.enabled=false
eureka.client.enabled=false

# Served by the Config Server at runtime; supplied directly here so the suite needs no infrastructure.
bank.transaction.max-amount=1000

# Overridden per test class by @DynamicPropertySource to point at the in-process fake account-service.
bank.account-service.url=http://localhost:8081

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2500
bank.resilience.timeout-ms=3000
bank.resilience.minimum-calls=5
bank.resilience.failure-rate-threshold=50
bank.resilience.open-state-seconds=10

spring.datasource.url=jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.ai.mcp.server.name=transaction-service
spring.ai.mcp.server.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
