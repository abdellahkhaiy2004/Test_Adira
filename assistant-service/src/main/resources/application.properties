spring.application.name=assistant-service
server.port=8084

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# --- LLM ---
# Requires a real key: set OPENAI_API_KEY before starting. Without it the service starts but every
# conversation fails with 401 from the provider. OPENAI_BASE_URL can point at any OpenAI-compatible
# endpoint (a local model server, for instance).
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.1

# --- MCP clients ---
# The assistant's only route to banking capabilities: the MCP servers of the two business services.
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=banking-assistant
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.sse.connections.account-service.url=${ACCOUNT_MCP_URL:http://localhost:8081}
spring.ai.mcp.client.sse.connections.transaction-service.url=${TRANSACTION_MCP_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
