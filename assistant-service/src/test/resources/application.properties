# Replaces src/main/resources/application.properties for the test run (same-name classpath shadowing).
spring.application.name=assistant-service
spring.cloud.config.enabled=false
eureka.client.enabled=false

# No real provider is contacted in the tests: the chat model is stubbed.
spring.ai.openai.api-key=test-key-not-used

# No MCP servers are running during the suite.
spring.ai.mcp.client.enabled=false

management.endpoints.web.exposure.include=health,info
