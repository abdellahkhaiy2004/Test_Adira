spring.application.name=config-server
server.port=8888

# "native" profile: configuration is served from files instead of a Git repository.
# The served files live in src/main/resources/config (see config/transaction-service.properties).
spring.profiles.active=native
spring.cloud.config.server.native.search-locations=classpath:/config

# The config server itself does not read its own configuration remotely.
spring.cloud.config.enabled=false

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

management.endpoints.web.exposure.include=health,info
