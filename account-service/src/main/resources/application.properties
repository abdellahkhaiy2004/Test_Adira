spring.application.name=account-service
server.port=8081

# Centralized configuration (Part 3). "optional:" keeps the service startable when the Config Server is down;
# account-service has no business parameter that only exists remotely.
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Service registration / discovery (Part 3).
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Datasource: in-memory H2 (development / tests only; data is lost on restart).
spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# GraphQL connector: same service layer as REST.
spring.graphql.graphiql.enabled=true

# MCP connector: same service layer as REST and GraphQL.
spring.ai.mcp.server.name=account-service
spring.ai.mcp.server.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
