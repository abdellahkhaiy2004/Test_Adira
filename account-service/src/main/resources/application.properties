spring.application.name=account-service
server.port=8081

# Part 1 bootstrap: Config Server and Eureka do not exist yet (Part 3), so they are disabled.
# Part 3 will switch these on (spring.cloud.config.enabled / eureka.client.enabled).
spring.cloud.config.enabled=false
eureka.client.enabled=false

# Datasource: in-memory H2 (development / tests only; data is lost on restart).
spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
