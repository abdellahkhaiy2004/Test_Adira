# Test configuration. A file with this name on the test classpath REPLACES the one in src/main/resources,
# so everything the tests need is repeated here, with the infrastructure clients switched off to keep
# the suite offline and fast.
spring.application.name=account-service

spring.cloud.config.enabled=false
eureka.client.enabled=false

spring.datasource.url=jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.ai.mcp.server.name=account-service
spring.ai.mcp.server.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
