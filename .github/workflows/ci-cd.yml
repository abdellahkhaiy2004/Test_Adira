# CI/CD for the banking platform (exam part I.3).
#
# Stages: compile -> test -> build images -> publish to a registry -> deploy.
#
# NOT VERIFIED: this pipeline has never run. There is no GitHub remote for this repository yet and
# Docker is not installed on the development machine, so the build/publish/deploy jobs are written
# from the real module names and ports but have not been executed.

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ---------- 1. compilation ----------
  build:
    name: Maven compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile the reactor
        run: ./mvnw -B -DskipTests package

      - name: Keep the jars for the image build
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: '*/target/*.jar'
          retention-days: 1

  # ---------- 2. automated tests ----------
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # The suite needs no external broker or database: Kafka runs embedded and H2 is in memory.
      - name: Run the test suite
        run: ./mvnw -B verify

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/**'

  test-frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --no-watch

      - name: Production build
        working-directory: frontend
        run: npm run build

  test-fraud-detection:
    name: Fraud detection script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: fraud-detection
        run: pip install -r requirements.txt

      # The real dataset is not in the repository, so CI exercises the pipeline on generated data.
      # This proves the script runs; it says nothing about the exam dataset's results.
      - name: Smoke-run on synthetic data
        working-directory: fraud-detection
        run: |
          python generate_sample_data.py --rows 5000
          python fraud_detection.py --data bank_transactions_SYNTHETIC.csv

  # ---------- 3 & 4. image construction and publication ----------
  publish-images:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module:
          - discovery-service
          - config-server
          - api-gateway
          - account-service
          - transaction-service
          - event-consumer
          - assistant-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Provided by GitHub; never a hardcoded credential.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.module }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend-image:
    name: Build and publish the frontend image
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  # ---------- 5. deployment ----------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [publish-images, publish-frontend-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4

      # Schematic, as the examination allows: no real cloud target exists for this project.
      # Secrets come from the environment's secret store and are never printed.
      - name: Deploy the stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Deploying ${{ github.sha }} to the staging environment."
          echo "Step 1 - pull the images just published to ${{ env.REGISTRY }}."
          echo "Step 2 - docker compose up -d with the new tag."
          echo "Step 3 - wait for every /actuator/health to report UP."
          echo "No real host is configured, so this job only reports the intended sequence."

      - name: Health check after deployment
        run: |
          echo "Would poll, in order:"
          echo "  discovery-service  :8761/actuator/health"
          echo "  config-server      :8888/actuator/health"
          echo "  account-service    :8081/actuator/health"
          echo "  transaction-service:8082/actuator/health"
          echo "  api-gateway        :8080/actuator/health"
          echo "A non-UP response fails the job and triggers the rollback below."

      - name: Roll back on failure
        if: failure()
        run: |
          echo "Re-deploying the previous image tag and re-running the health checks."
