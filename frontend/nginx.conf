server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The production environment uses relative paths, so the browser never needs to know the
    # gateway's host: nginx forwards /api to it inside the compose network.
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # assistant-service is not routed by the gateway, so it is proxied directly.
    location /assistant-api/ {
        proxy_pass http://assistant-service:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Angular routing: unknown paths are application routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
