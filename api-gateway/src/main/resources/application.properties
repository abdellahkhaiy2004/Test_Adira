spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Routes use lb:// so the target instance is resolved through Eureka, never a hardcoded host.

# --- REST ---
spring.cloud.gateway.server.webmvc.routes[0].id=account-rest
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://account-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/accounts/**

spring.cloud.gateway.server.webmvc.routes[1].id=transaction-rest
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://transaction-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/transactions/**,/api/transfers/**

# --- GraphQL (one endpoint per service, both rewritten to /graphql) ---
spring.cloud.gateway.server.webmvc.routes[2].id=account-graphql
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://account-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/account/graphql
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=SetPath=/graphql

spring.cloud.gateway.server.webmvc.routes[3].id=transaction-graphql
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://transaction-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/transaction/graphql
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/graphql

# --- MCP (JSON-RPC endpoint of each business service) ---
spring.cloud.gateway.server.webmvc.routes[4].id=account-mcp
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://account-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/account/mcp/**
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webmvc.routes[5].id=transaction-mcp
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://transaction-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/transaction/mcp/**
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=health,info,gateway
